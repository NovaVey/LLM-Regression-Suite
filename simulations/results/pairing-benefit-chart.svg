<svg width="480" height="320" viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paired detection rate 21.3% versus unpaired detection rate 14.3% at the same sample size">
  <rect x="0" y="0" width="480" height="320" fill="#fcfcfb" />
  <text x="56" y="26" font-size="16" font-weight="600" fill="#0b0b0b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Paired detects the regression more often</text>
  <text x="56" y="44" font-size="12" fill="#898781" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">§6.5 -- n=100, injected regression=8pt, 300 trials</text>
  <line x1="56" y1="264.0" x2="448" y2="264.0" stroke="#e1e0d9" stroke-width="1" />
  <line x1="56" y1="212.0" x2="448" y2="212.0" stroke="#e1e0d9" stroke-width="1" />
  <line x1="56" y1="160.0" x2="448" y2="160.0" stroke="#e1e0d9" stroke-width="1" />
  <line x1="56" y1="108.0" x2="448" y2="108.0" stroke="#e1e0d9" stroke-width="1" />
  <line x1="56" y1="56.0" x2="448" y2="56.0" stroke="#e1e0d9" stroke-width="1" />
  <line x1="56" y1="264" x2="448" y2="264" stroke="#c3c2b7" stroke-width="1" />
  <text x="46" y="268.0" text-anchor="end" font-size="11" fill="#898781" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">0%</text>
  <text x="46" y="216.0" text-anchor="end" font-size="11" fill="#898781" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">10%</text>
  <text x="46" y="164.0" text-anchor="end" font-size="11" fill="#898781" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">20%</text>
  <text x="46" y="112.0" text-anchor="end" font-size="11" fill="#898781" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">30%</text>
  <text x="46" y="60.0" text-anchor="end" font-size="11" fill="#898781" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">40%</text>
  
    <rect x="114.8" y="153.1" width="78.4" height="110.9" rx="4" fill="#2a78d6" />
